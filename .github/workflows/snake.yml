# Guardar como: .github/workflows/snake.yml (en el repo eversuelo/eversuelo)
# Genera el snake del contribution graph y lo publica en la rama `output`.
# Después de la primera corrida, descomenta el <img> del snake en el README.

name: generate snake

on:
  schedule:
    - cron: "0 6 * * *" # diario, 6:00 UTC (~medianoche MX)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: eversuelo
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00ff41

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
